[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "crategraph-forceatlas2"
version = "0.1.0"
description = "Fast MIT-licensed ForceAtlas2 layout: a faithful Rust port of graphology-layout-forceatlas2"
readme = "README.md"
authors = [{ name = "Daniel Russo-Batterham" }]
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["forceatlas2", "graph", "layout", "network", "visualisation", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/unimelbmdap/crategraph-forceatlas2"
Issues = "https://github.com/unimelbmdap/crategraph-forceatlas2/issues"

[tool.maturin]
manifest-path = "bindings/Cargo.toml"
module-name = "crategraph_forceatlas2._native"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
